services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pi
      POSTGRES_PASSWORD: pi
      POSTGRES_DB: product_intelligence
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations and seed run automatically on first start only.
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./database/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi -d product_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      # Local convenience only. In Azure use Key Vault references.
      DATABASE_URL: postgresql+psycopg://pi:pi@db:5432/product_intelligence
      CLASSIFIER_DATABASE_URL: postgresql+psycopg://pi:pi@db:5432/product_intelligence
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      ENVIRONMENT: local
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
